<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Test</title>
<style>
body{margin:0;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0b0f20;color:#fff;padding:20px}
input{font-size:16px;padding:12px;width:100%;box-sizing:border-box;border-radius:8px;border:1px solid #333;background:#10152a;color:#fff;margin-top:10px}
</style>
</head>
<body>
<h2>Testinis laukas (be jokio žaidimo kodo)</h2>
<p>Paliesk laukelį ir pabandyk rašyti. Jei klaviatūra ir čia dingsta — tai įrenginio/naršyklės elgesys, ne žaidimo kaltė.</p>
<input id="t1" placeholder="Rašyk čia" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<p id="log" style="margin-top:20px;color:#8f9ac4"></p>
<script>
const log=document.getElementById('log');
const i=document.getElementById('t1');
let n=0;
function add(m){n++;log.textContent=n+'. '+m+'\n'+log.textContent}
i.addEventListener('focus',()=>add('FOCUS'));
i.addEventListener('blur',()=>add('BLUR'));
i.addEventListener('input',()=>add('INPUT: '+i.value));
</script>
</body>
</html>
