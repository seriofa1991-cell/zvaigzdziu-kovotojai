<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
    <stop offset="0%" stop-color="#241a0e"/>
    <stop offset="65%" stop-color="#140d07"/>
    <stop offset="100%" stop-color="#0a0604"/>
  </radialGradient>
  <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f6e2a0"/>
    <stop offset="50%" stop-color="#d9a93f"/>
    <stop offset="100%" stop-color="#f6e2a0"/>
  </linearGradient>
  <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#fdf0c2"/>
    <stop offset="45%" stop-color="#f0cc63"/>
    <stop offset="100%" stop-color="#c8962f"/>
  </linearGradient>
  <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fdf6e3"/>
    <stop offset="100%" stop-color="#aebdc9"/>
  </linearGradient>
</defs>

<circle cx="100" cy="100" r="96" fill="url(#bgGrad)"/>
<circle cx="100" cy="100" r="96" fill="none" stroke="url(#ringGrad)" stroke-width="8"/>

<!-- single bold vertical sword behind the star, simplified so it reads at small sizes -->
<g transform="translate(100,104)">
  <path d="M0,-82 L10,-14 L-10,-14 Z" fill="url(#bladeGrad)" stroke="#20150a" stroke-width="2"/>
  <rect x="-24" y="-18" width="48" height="10" rx="2" fill="url(#goldGrad)" stroke="#20150a" stroke-width="2"/>
  <rect x="-6" y="-8" width="12" height="34" rx="2" fill="#3a2410" stroke="#20150a" stroke-width="2"/>
  <circle cx="0" cy="30" r="9" fill="url(#goldGrad)" stroke="#20150a" stroke-width="2"/>
</g>

<!-- big bold star on top, high contrast -->
<polygon points="100,28 114,66 155,67 122,92 134,132 100,108 66,132 78,92 45,67 86,66"
  fill="url(#goldGrad)" stroke="#20150a" stroke-width="4" stroke-linejoin="round"/>

<circle cx="100" cy="100" r="96" fill="none" stroke="#000" stroke-opacity=".3" stroke-width="2"/>
</svg>
